; (DA_PawnData_Lumen이 다른 PawnData들과 달리 AI/PawnData가 아닌 Data 폴더에 있어 DT_MonsterData 경로를 안 탐)
+DirectoriesToAlwaysCook=(Path="/Game/Retrieve/Character/Lumen")
