; 설정 화면 볼륨 슬라이더가 사용하는 SoundMix / 채널별 SoundClass.
; 마스터는 코드에서 전역(TransientPrimaryVolume)으로 적용되고, 나머지 채널은 이 SoundMix의
; SoundClass Override로 적용된다. 하위 채널이 실제로 들리려면 사운드 에셋을 해당 SoundClass로
