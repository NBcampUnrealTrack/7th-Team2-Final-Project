+DirectoriesToAlwaysCook=(Path="/NNEDenoiser")
; 루멘(동료 소환수) 관련 자산은 DT_MonsterData/PD_Sovereign 같은 기존 쿠킹 루트에서
; 하드 레퍼런스로 연결되지 않아 패키징에서 통째로 누락되는 문제 방지.
; (DA_PawnData_Lumen이 다른 PawnData들과 달리 AI/PawnData가 아닌 Data 폴더에 있어 DT_MonsterData 경로를 안 탐)
+DirectoriesToAlwaysCook=(Path="/Game/Retrieve/Character/Lumen")
+DirectoriesToAlwaysCook=(Path="/Game/Retrieve/Data")
+DirectoriesToAlwaysCook=(Path="/Game/Retrieve/AI/EQS")
; 루멘 스켈레탈메시(SK_BR_Character_ElementalGolem_01)는 BP_LumenCharacter의 하드 레퍼런스로
; 이미 쿠킹에 포함되고 있었다 — 빠졌던 건 그 메시가 쓰는 머티리얼(M_FantasyRivals_01_A)뿐이었다.
; Meshes 폴더는 넣지 않는다: Meshes/New_Characters 안에 안 쓰는 다른 캐릭터 BP 20여 개가 같이 있고
; 그중 하나가 깨진 EpicContent/Blueprints/ThirdPersonCharacter를 참조해 쿠킹이 실패했다.
+DirectoriesToAlwaysCook=(Path="/Game/External/PolygonFantasyRivals/Materials")
+DirectoriesToAlwaysCook=(Path="/Game/External/PolygonFantasyRivals/Textures")
; DT_ItemIcon(및 다른 DataTable)이 참조하는 아이콘 텍스처는 소프트 레퍼런스라
; DataTable 자체가 쿠킹돼도 자동으로 따라 들어온다는 보장이 없어 인벤토리 패널
; 아이콘 로딩(LoadSynchronous) 시 Shipping에서만 크래시하는 원인이 됐다. 명시적으로 강제 포함.
+DirectoriesToAlwaysCook=(Path="/Game/Retrieve/UI/Icons")
+DirectoriesToAlwaysCook=(Path="/Game/UI/Icons")
; DT_ItemIcon이 Icons_Weapons뿐 아니라 Icons_Inventory(투구), Icons_Resources(재료) 등
; UIFantasyWarriorHUD의 여러 Icons_* 서브폴더를 함께 참조한다. 서브폴더를 하나씩 놓칠 때마다
; 매번 새 버그로 나타났으므로 상위 Textures 폴더 전체를 강제 포함시켜 재발을 막는다.
+DirectoriesToAlwaysCook=(Path="/Game/External/UIFantasyWarriorHUD/Textures")
+DirectoriesToAlwaysCook=(Path="/Game/Retrieve/AI/StateTrees")
; ARetrieveBonfireActor::BonfireMenuClass, ARetrievePuzzleActor::PuzzlePanelClass는 모두
; TSoftClassPtr로 위젯을 참조해 하드 레퍼런스 체인이 없다. 쿠커가 이 폴더들에 도달하지
; 못해 LoadSynchronous()가 Shipping에서 null을 반환하며 위젯이 조용히 열리지 않았다.
+DirectoriesToAlwaysCook=(Path="/Game/Retrieve/UI/Bonfire")
+DirectoriesToAlwaysCook=(Path="/Game/Retrieve/UI/Puzzle")
; 화살(Bow) 조준점(WBP_Reticle_Bow)이 참조하는 크로스헤어/닷 텍스처가 이 폴더에 있는데
; Icons_Weapons 서브폴더만 always-cook에 포함돼 있었다. 소프트 레퍼런스라 Shipping에서
; 조준점 텍스처가 로드되지 않아 조준 점이 안 보였다.
+DirectoriesToAlwaysCook=(Path="/Game/External/UIFantasyWarriorHUD/Textures/HUD")
