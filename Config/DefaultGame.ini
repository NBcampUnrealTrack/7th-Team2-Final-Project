; SettingsPanelClass(TSoftClassPtr)로만 참조돼 하드 레퍼런스 체인이 없다. 쿠커가 이 폴더에
; 도달하지 못해 LoadSynchronous()가 Shipping에서 null을 반환, F10/메인메뉴 설정 버튼을 눌러도
; 설정창이 조용히 열리지 않았다. (Bonfire/Puzzle/Interaction과 동일 패턴)
+DirectoriesToAlwaysCook=(Path="/Game/Retrieve/UI/Settings")
; 시스템 메뉴(WBP_SystemMenu)도 PlayerController의 SystemMenuClass(TSoftClassPtr)로만 참조돼
; 같은 이유로 쿠커가 폴더에 도달하지 못해 패키지에서 LoadSynchronous()가 null → ESC로 메뉴가 열리지 않았다.
+DirectoriesToAlwaysCook=(Path="/Game/Retrieve/UI/Menu")
; SystemMessage(URetrieveSystemMessageWidget)의 튜토리얼 해제 게이트 열림음(TutorialOpenSound)이
; C++ 하드코딩 소프트 경로(SFX_UI_PanelClose_V3)로만 참조돼 하드 레퍼런스 체인이 없다. 쿠커가 이
; 오디오 폴더에 도달하지 못해 Shipping에서 LoadSynchronous()가 null을 반환, 효과음이 나지 않았다.
; (Bonfire/Puzzle/Interaction/Settings/Menu와 동일 패턴)
+DirectoriesToAlwaysCook=(Path="/Game/Retrieve/Audio/UI")
