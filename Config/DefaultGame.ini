; UIFantasyWarriorHUD의 여러 Icons_* 서브폴더를 함께 참조한다. 서브폴더를 하나씩 놓칠 때마다
; 매번 새 버그로 나타났으므로 상위 Textures 폴더 전체를 강제 포함시켜 재발을 막는다.
+DirectoriesToAlwaysCook=(Path="/Game/External/UIFantasyWarriorHUD/Textures")
+DirectoriesToAlwaysCook=(Path="/Game/Retrieve/AI/StateTrees")
; ARetrieveBonfireActor::BonfireMenuClass, ARetrievePuzzleActor::PuzzlePanelClass는 모두
; TSoftClassPtr로 위젯을 참조해 하드 레퍼런스 체인이 없다. 쿠커가 이 폴더들에 도달하지
; 못해 LoadSynchronous()가 Shipping에서 null을 반환하며 위젯이 조용히 열리지 않았다.
+DirectoriesToAlwaysCook=(Path="/Game/Retrieve/UI/Bonfire")
+DirectoriesToAlwaysCook=(Path="/Game/Retrieve/UI/Puzzle")
; 화살(Bow) 조준점(WBP_Reticle_Bow)이 참조하는 크로스헤어/닷 텍스처가 이 폴더에 있는데
; Icons_Weapons 서브폴더만 always-cook에 포함돼 있었다. 소프트 레퍼런스라 Shipping에서
; 조준점 텍스처가 로드되지 않아 조준 점이 안 보였다.
+DirectoriesToAlwaysCook=(Path="/Game/External/UIFantasyWarriorHUD/Textures/HUD")
; RetrieveToastManagerWidget::OnInventoryItemAdded가 WBP_ItemPickupToast를
; LoadClass<UUserWidget>(경로 문자열)로 런타임에 로드한다. 하드 레퍼런스 체인이 없어
; 쿠커가 이 폴더에 도달하지 못했고, Shipping에서 LoadClass가 null을 반환해 아이템
; 획득 토스트(및 향후 이 폴더에 추가될 상호작용 UI)가 조용히 표시되지 않았다.
+DirectoriesToAlwaysCook=(Path="/Game/Retrieve/UI/Interaction")
