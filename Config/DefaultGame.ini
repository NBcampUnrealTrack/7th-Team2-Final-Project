; Meshes 폴더는 넣지 않는다: Meshes/New_Characters 안에 안 쓰는 다른 캐릭터 BP 20여 개가 같이 있고
; 그중 하나가 깨진 EpicContent/Blueprints/ThirdPersonCharacter를 참조해 쿠킹이 실패했다.
+DirectoriesToAlwaysCook=(Path="/Game/External/PolygonFantasyRivals/Materials")
+DirectoriesToAlwaysCook=(Path="/Game/External/PolygonFantasyRivals/Textures")
; DT_ItemIcon(및 다른 DataTable)이 참조하는 아이콘 텍스처는 소프트 레퍼런스라
; DataTable 자체가 쿠킹돼도 자동으로 따라 들어온다는 보장이 없어 인벤토리 패널
; 아이콘 로딩(LoadSynchronous) 시 Shipping에서만 크래시하는 원인이 됐다. 명시적으로 강제 포함.
+DirectoriesToAlwaysCook=(Path="/Game/Retrieve/UI/Icons")
+DirectoriesToAlwaysCook=(Path="/Game/UI/Icons")
